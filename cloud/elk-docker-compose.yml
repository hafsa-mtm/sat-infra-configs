services:
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    network_mode: host
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=sat_elastic_2026
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  logstash:
    image: logstash:8.13.0
    container_name: logstash
    network_mode: host
    environment:
      - xpack.monitoring.enabled=false
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./wazuh-logstash.conf:/usr/share/logstash/pipeline/wazuh-logstash.conf
      - wazuh_logs:/var/ossec/logs
    restart: unless-stopped
  kibana:
    image: kibana:8.13.0
    container_name: kibana
    network_mode: host
    environment:
      - ELASTICSEARCH_HOSTS=http://localhost:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=AAEAAWVsYXN0aWMva2liYW5hL2tpYmFuYS10b2tlbjpfMkxfUmNuUlJ4R1JmcFIzZE1fRnln
    restart: unless-stopped
volumes:
  esdata:
  wazuh_logs:
    external: true
    name: wazuh_wazuh_logs
