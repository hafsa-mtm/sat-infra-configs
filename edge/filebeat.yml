filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
  - type: log
    paths:
      - /var/log/syslog
      - /var/log/auth.log
    fields:
      source: system
      host: edge

output.kafka:
  hosts: ["192.168.87.132:9093"]
  topic: "logs"
  partition.round_robin:
    reachable_only: false
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
